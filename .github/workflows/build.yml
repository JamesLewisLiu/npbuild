name: Build xcaddy with naiveproxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version (leave empty for latest)'
        required: false
        default: ''

# 全局权限设置：默认只读，Release Job 单独提权
permissions:
  contents: read

env:
  XCADDY_VERSION: v0.4.5
  # 设置 Go 编译参数，减小体积
  GO_FLAGS: "-ldflags='-s -w'" 

jobs:
  build:
    name: Build ${{ matrix.os_label }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            os_label: linux
            arch: amd64
          - runner: ubuntu-latest
            goos: linux
            os_label: linux
            arch: arm64
          - runner: ubuntu-latest
            goos: linux
            os_label: linux
            arch: armv7
            # 如果需要 Windows/Mac 支持，取消下面的注释即可
            # - runner: windows-latest
            #   goos: windows
            #   os_label: windows
            #   arch: amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # 使用更现代的 Go 版本
          check-latest: true
          cache: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@${{ env.XCADDY_VERSION }}

      - name: Resolve Caddy Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先使用输入版本，否则通过 GitHub CLI 获取最新 Release Tag
          INPUT_VER="${{ inputs.caddy_version }}"
          if [ -z "$INPUT_VER" ] || [ "$INPUT_VER" == "latest" ]; then
            CADDY_VER=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          else
            CADDY_VER=$INPUT_VER
          fi
          echo "Target Caddy Version: $CADDY_VER"
          echo "caddy_version=$CADDY_VER" >> $GITHUB_OUTPUT

      - name: Configure Cross-Compile
        run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          if [ "${{ matrix.arch }}" = "armv7" ]; then
            echo "GOARCH=arm" >> $GITHUB_ENV
            echo "GOARM=7" >> $GITHUB_ENV
          else
            echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          fi

      - name: Build Caddy (Naiveproxy)
        run: |
          FILENAME="caddy-${{ matrix.os_label }}-${{ matrix.arch }}"
          [ "${{ matrix.goos }}" = "windows" ] && FILENAME="${FILENAME}.exe"
          
          # 使用 xcaddy 构建
          xcaddy build ${{ steps.version.outputs.caddy_version }} \
            --output "$FILENAME" \
            --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive
        env:
          CGO_ENABLED: 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_label }}-${{ matrix.arch }}
          path: caddy-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release 和 Tag
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true # v4 新特性：自动合并所有文件到同一目录，不再嵌套文件夹

      - name: Generate Release Tag
        id: tag_logic
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # 手动触发：生成 时间戳 (Epoch)
            EPOCH=$(date +%s)
            TAG_NAME="${EPOCH}"
            echo "Mode: Manual Trigger"
            echo "Generate Title: Manual Build ${EPOCH}"
            echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_title=Manual Build ${EPOCH}" >> $GITHUB_OUTPUT
          else
            # Push Tag 触发：使用原有 Tag
            REF_TAG=${GITHUB_REF#refs/tags/}
            echo "Mode: Tag Trigger"
            echo "release_tag=${REF_TAG}" >> $GITHUB_OUTPUT
            echo "release_title=${REF_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_logic.outputs.release_tag }}
          name: ${{ steps.tag_logic.outputs.release_title }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
